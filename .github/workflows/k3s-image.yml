# Despliegue: cuando CI termina en verde sobre main, se construye la imagen de
# ESE commit y se anota en bezenti-gitops (apps/omni); ArgoCD la lleva al
# clúster. Un CI en rojo no construye nada, así que no sale nada.
name: k3s image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A mano, para volver a desplegar lo último de main sin un commit nuevo.
  workflow_dispatch:

concurrency:
  group: k3s-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/darwinva97/omni

jobs:
  build:
    # Solo con CI en verde y solo para pushes a main (no para PRs).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: k3s-omni
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Las pruebas unitarias corren también dentro del build: si fallan, no hay imagen.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: k3s-omni
    steps:
      - uses: actions/checkout@v4
        with:
          repository: darwinva97/bezenti-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Actualizar el tag de la imagen
        run: |
          sed -i -E "s|(image: ghcr.io/darwinva97/omni:)[^ ]*( # omni-image)|\1${{ needs.build.outputs.tag }}\2|" apps/omni/workloads.yaml
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "omni: ${{ needs.build.outputs.tag }}" || echo "sin cambios"
          git pull --rebase -q && git push
